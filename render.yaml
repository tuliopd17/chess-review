# Blueprint do Render (https://render.com) — deploy via Docker.
#
# Como usar:
#   1. Suba este repo no GitHub.
#   2. No Render: New > Blueprint > conecte o repo. Ele lê este arquivo.
#   3. Deploy. O Render builda o Dockerfile e injeta a porta via $PORT.
#
# O plano "free" hiberna após ~15 min sem tráfego (cold start de alguns segundos
# no próximo acesso). Pra evitar isso, troque para um plano pago (ex: "starter").
services:
  - type: web
    name: chess-review
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
